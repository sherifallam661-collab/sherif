name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Manifest permissions and service
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#  <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n  <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n  <uses-permission android:name="android.permission.VIBRATE"/>\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n</manifest>#' $M
          sed -i 's#</application>#  <service android:name=".PrayerService" android:exported="false" android:foregroundServiceType="dataSync"/>\n</application>#' $M
          cp native/*.java android/app/src/main/java/com/example/prayerqibla/
          ls android/app/src/main/java/com/example/prayerqibla/
          cat $M
      - name: Launcher icon and notification icon
        run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/raw
          cat > $R/drawable/ic_stat_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M13,2.25 L13.36,3.3 L14.47,3.32 L13.59,3.99 L13.91,5.05 L13,4.42 L12.09,5.05 L12.41,3.99 L11.53,3.32 L12.64,3.3 Z M12.4,0.6 A3.2,3.2 0 0 0 12.4,7 A6,6 0 0 1 12.4,0.6 Z M12,6.8 C12.8,9 17.8,10.5 18.6,15 C19,17.5 17.5,19.3 17,19.5 L7,19.5 C6.5,19.3 5,17.5 5.4,15 C6.2,10.5 11.2,9 12,6.8 Z M4,20.8 H20 V22.6 H4 Z"/>
          </vector>
          XML
          cp -n resources/raw/* $R/raw/ 2>/dev/null || true
          cp www/adhan_*.mp3 www/reminder_*.wav $R/raw/
          if [ -f icon.png ]; then
            if command -v magick >/dev/null 2>&1; then IM="magick"
            elif command -v convert >/dev/null 2>&1; then IM="convert"
            else sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick && IM="convert"; fi
            BG=$($IM icon.png -format '%[hex:p{3,3}]' info:)
            BG=${BG:0:6}
            rm -f $R/drawable-v24/ic_launcher_foreground.xml $R/drawable/ic_launcher_background.xml
            mkdir -p $R/mipmap-anydpi-v26 $R/values
            echo "<resources><color name=\"ic_launcher_background\">#$BG</color></resources>" > $R/values/ic_launcher_background.xml
            for f in ic_launcher ic_launcher_round; do
              printf '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' > $R/mipmap-anydpi-v26/$f.xml
            done
            for pair in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read d s fsz <<< "$pair"
              mkdir -p $R/mipmap-$d
              inner=$((fsz*66/100))
              $IM icon.png -resize ${inner}x${inner} -background none -gravity center -extent ${fsz}x${fsz} $R/mipmap-$d/ic_launcher_foreground.png
              $IM icon.png -resize ${s}x${s} -alpha set \( -size ${s}x${s} xc:none -fill white -draw "roundrectangle 0,0 $((s-1)),$((s-1)) $((s/5)),$((s/5))" \) -compose DstIn -composite $R/mipmap-$d/ic_launcher.png
              $IM icon.png -resize ${s}x${s} -alpha set \( -size ${s}x${s} xc:none -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -compose DstIn -composite $R/mipmap-$d/ic_launcher_round.png
            done
          else
            echo "WARNING: icon.png not found in repo root, default launcher icon kept"
          fi
          ls $R/drawable
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
